<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ura</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="center-box">
  <div class="card">
    <h1>📡 Ura</h1>
    <!-- first run -->
    <form id="setup" hidden>
      <p class="muted">Welcome! Create the admin password for this bridge.</p>
      <div class="field">
        <label for="code">Setup code</label>
        <input type="text" id="code" autocomplete="off" required>
        <div class="help">Printed in the bridge log at startup, and saved in <code>data/setup-code.txt</code>.
          It proves you are the person who installed the bridge.</div>
      </div>
      <div class="field">
        <label for="pw1">Admin password</label>
        <input type="password" id="pw1" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="pw2">Repeat password</label>
        <input type="password" id="pw2" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="primary" type="submit">Create and continue</button>
    </form>
    <!-- login -->
    <form id="login" hidden>
      <p class="muted">Log in to manage the bridge.</p>
      <div class="field">
        <label for="pw">Password</label>
        <input type="password" id="pw" autocomplete="current-password" required autofocus>
      </div>
      <button class="primary" type="submit">Log in</button>
    </form>
    <p id="err" class="bad"></p>
  </div>
</div>
<script>
const isSetup = location.pathname.endsWith("/setup");
const form = document.getElementById(isSetup ? "setup" : "login");
form.hidden = false;
const err = document.getElementById("err");

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
}
form.onsubmit = async e => {
  e.preventDefault();
  err.textContent = "";
  const btn = form.querySelector("button");
  btn.disabled = true;
  try {
    if (isSetup) {
      const a = document.getElementById("pw1").value, b = document.getElementById("pw2").value;
      if (a !== b) throw new Error("The passwords do not match");
      await post("api/setup", { code: document.getElementById("code").value, password: a });
      location.href = "settings";
    } else {
      await post("api/login", { password: document.getElementById("pw").value });
      location.href = "./";
    }
  } catch (x) { err.textContent = x.message; }
  btn.disabled = false;
};
</script>
</body>
</html>
